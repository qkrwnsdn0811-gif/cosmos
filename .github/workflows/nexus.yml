name: nexus

# NEXUS 시연 서버(GCP) CI/CD. 테스트가 통과한 main push만 Artifact Registry를 거쳐 VM의 deploy.sh로 배포한다.
# ci와 deploy는 workflow_run 대신 한 워크플로의 needs로 이어, 배포가 같은 커밋의 두 테스트를 기다리게 한다.
on:
  push:
    branches: [main]
    paths:
      - 'BackEnd/**'
      - 'FrontEnd/**'
      - 'deploy/compose.yml'
      - 'deploy/scripts/**'
      - '.github/workflows/nexus.yml'
  pull_request:
    branches: [main]
    paths:
      - 'BackEnd/**'
      - 'FrontEnd/**'
      - 'deploy/compose.yml'
      - 'deploy/scripts/**'
      - '.github/workflows/nexus.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GCP_PROJECT: cosmos-nexus-1026
  GCP_ZONE: asia-northeast3-a
  GCP_VM: nexus-vm
  GCP_WIF_PROVIDER: projects/1043600593127/locations/global/workloadIdentityPools/github/providers/cosmos-nexus
  GCP_SERVICE_ACCOUNT: github-deployer@cosmos-nexus-1026.iam.gserviceaccount.com
  REGISTRY: asia-northeast3-docker.pkg.dev/cosmos-nexus-1026/cosmos
  DEMO_URL: https://34-158-212-210.sslip.io

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: FrontEnd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: FrontEnd/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: BackEnd
    # deploy/compose.ci.yml과 같은 일회용 PostgreSQL·Redis
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cosmos_test
          POSTGRES_USER: cosmos_test
          POSTGRES_PASSWORD: ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cosmos_test -d cosmos_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DB_URL: jdbc:postgresql://localhost:5432/cosmos_test
      DB_USERNAME: cosmos_test
      DB_PASSWORD: ci-test-only
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: BackEnd/build/reports/tests/test

  deploy:
    needs: [frontend, backend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: nexus-demo
      url: ${{ env.DEMO_URL }}
    # 진행 중인 배포는 끊지 않는다. 기다리는 오래된 실행은 최신 실행으로 바뀐다.
    concurrency:
      group: nexus-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: echo "tag=gh-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: docker/login-action@v4
        with:
          registry: asia-northeast3-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@v4
      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: BackEnd
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/cosmos-backend:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: FrontEnd
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/cosmos-frontend:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - uses: google-github-actions/setup-gcloud@v3
      # 헬스체크·스모크 테스트·실패 시 직전 릴리스 복구는 VM의 deploy.sh가 한다.
      - name: Deploy on the VM
        run: >-
          gcloud compute ssh "$GCP_VM" --zone "$GCP_ZONE" --project "$GCP_PROJECT"
          --tunnel-through-iap --quiet --strict-host-key-checking=no
          --command "sudo -u cosmos-ci bash /opt/cosmos/checkouts/cosmos/deploy/scripts/deploy-from-registry.sh $GITHUB_SHA $REGISTRY"
      - name: Check the demo URL
        run: curl --fail --silent --show-error --max-time 15 "$DEMO_URL/healthz" | grep -q '"status":"UP"'
