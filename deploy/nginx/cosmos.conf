# Install after the certificate exists; nginx -t must pass before reloading.
map $http_upgrade $cosmos_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name j15c205.p.ssafy.io;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/cosmos-acme;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name j15c205.p.ssafy.io;
    ssl_certificate /etc/letsencrypt/live/j15c205.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j15c205.p.ssafy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 10m;

    # 프록시로 지나가는 API JSON 도 압축한다 (2026-09-18 Lighthouse: /api/graphs/latest 65KB 무압축).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /jenkins { return 301 /jenkins/; }
    location ^~ /jenkins/ {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cosmos_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:18081/actuator/health;
    }
    location = /api { proxy_pass http://127.0.0.1:18081; }
    location ^~ /api/ { proxy_pass http://127.0.0.1:18081; }
    location / { proxy_pass http://127.0.0.1:18080; }
}
