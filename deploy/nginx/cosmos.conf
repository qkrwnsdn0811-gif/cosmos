# Install after the certificate exists; nginx -t must pass before reloading.
map $http_upgrade $cosmos_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name j15c205.p.ssafy.io;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/cosmos-acme;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name j15c205.p.ssafy.io;
    ssl_certificate /etc/letsencrypt/live/j15c205.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j15c205.p.ssafy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 10m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /jenkins { return 301 /jenkins/; }
    location ^~ /jenkins/ {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cosmos_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:18081/actuator/health;
    }
    location = /api { proxy_pass http://127.0.0.1:18081; }
    location ^~ /api/ { proxy_pass http://127.0.0.1:18081; }
    location / { proxy_pass http://127.0.0.1:18080; }
}
