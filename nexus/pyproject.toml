[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus"
version = "0.1.0"
description = "NEXUS: BigKinds news → reported/inferred company impact pipeline (2026 뉴스빅데이터 해커톤)"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "pandas",
    "pyarrow",
    "psycopg[binary]>=3.2",
    "finance-datareader==0.9.202",
    "pyahocorasick",
    "scikit-learn>=1.6",
    "joblib",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# KR-FinBERT 감성 분석(`nexus sentiment`)에만 필요하다. 버전은 COSMOS AI/gpu_news/requirements.txt와 같다.
ml = ["torch==2.14.1", "transformers==5.16.1", "tokenizers==0.23.2", "huggingface-hub==1.30.0", "safetensors==0.8.0"]

[tool.setuptools.packages.find]
include = ["nexus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
